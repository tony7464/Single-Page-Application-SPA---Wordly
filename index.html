<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordly — Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <h1 class="logo">Wordly</h1>
        <p class="tagline">Look up words. Save favorites. Learn as you go.</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-btn" aria-label="Toggle light and dark theme">
        Toggle theme
      </button>
    </header>

    <main>
      <section class="search-section" aria-labelledby="search-heading">
        <h2 id="search-heading" class="visually-hidden">Search for a word</h2>
        <form id="search-form" class="search-form" novalidate>
          <label for="word-input" class="visually-hidden">Word to look up</label>
          <input
            type="text"
            id="word-input"
            name="word"
            placeholder="Try a word like serendipity"
            autocomplete="off"
            spellcheck="true"
            aria-describedby="search-hint"
            required
          />
          <button type="submit" id="search-btn" aria-label="Search dictionary">Search</button>
        </form>
        <p id="search-hint" class="hint">Enter a word to see definitions, synonyms, and pronunciation.</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="results" class="results" aria-live="polite" hidden>
        <div class="results-header">
          <div>
            <h2 id="result-word" class="result-word"></h2>
            <p id="result-phonetic" class="phonetic"></p>
          </div>
          <div class="result-actions">
            <button type="button" id="audio-btn" class="icon-btn" aria-label="Play pronunciation" hidden>
              Play audio
            </button>
            <button type="button" id="save-btn" class="icon-btn" aria-label="Save word to favorites">
              Save
            </button>
          </div>
        </div>
        <div id="meanings" class="meanings"></div>
        <div id="source" class="source" hidden></div>
      </section>

      <section class="favorites-section" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading">Saved Words</h2>
        <ul id="favorites-list" class="favorites-list"></ul>
        <p id="favorites-empty" class="hint">No favorites yet — save a word after you look it up.</p>
      </section>
    </main>

    <footer class="footer">
      <p>Powered by the <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener noreferrer">Free Dictionary API</a></p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
